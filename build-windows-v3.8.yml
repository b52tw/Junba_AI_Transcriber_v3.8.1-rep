name: Build Junba AI Transcriber v3.8.1 Repack + Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'tools/**'
      - '.github/workflows/build-windows-v3.8.yml'
      - 'README_FIRST.txt'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: junba-ai-transcriber-v381-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_REPO: b52tw/Junba-AI-Transcriber-3.8-R2ktv
  BASE_REF: 847f91902b2569c5791366bc73f45713d2f2b94a
  ANDROID_REPO: b52tw/Junba_AI_Transcriber_v3.81_HOTFIX
  ANDROID_REF: 5004a751dc14173c2a42f41ecd7d5143d2a94305

jobs:
  validate-windows:
    name: Validate Windows v3.8.1 source
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repack tools
        uses: actions/checkout@v4
        with:
          path: repack
      - name: Checkout pinned Junba v3.8 base
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BASE_REPO }}
          ref: ${{ env.BASE_REF }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: src/requirements.txt
      - name: Apply v3.8.1 changes
        shell: pwsh
        run: python repack/tools/apply_v381_patch.py --root src
      - name: Verify requested changes
        shell: pwsh
        run: python repack/tools/verify_v381_patch.py --root src
      - name: Install dependencies
        working-directory: src
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip check
      - name: Compile and test source
        working-directory: src
        shell: pwsh
        run: |
          python -m compileall -q main.py app
          if (Test-Path tests) { pytest -q tests }
          $env:QT_QPA_PLATFORM = 'offscreen'
          python main.py --ui-self-test "$pwd/UI_SELFTEST_SOURCE.txt"
          if (-not (Select-String -Path "$pwd/UI_SELFTEST_SOURCE.txt" -Pattern 'UI_SELFTEST_OK' -Quiet)) { throw 'Source UI self-test failed' }

  portable:
    name: Build Portable x64
    needs: validate-windows
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { path: repack }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BASE_REPO }}
          ref: ${{ env.BASE_REF }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: src/requirements.txt
      - name: Patch and install
        shell: pwsh
        run: |
          python repack/tools/apply_v381_patch.py --root src
          python repack/tools/verify_v381_patch.py --root src
          cd src
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build Portable
        working-directory: src
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean JunbaAITranscriber_portable.spec
          $exe = "$pwd/dist/Junba_AI_Transcriber_v3.8_Portable/Junba_AI_Transcriber_v3.8.exe"
          if (!(Test-Path $exe)) { throw 'Portable EXE not found' }
      - name: Portable self-tests
        working-directory: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exe = "$pwd/dist/Junba_AI_Transcriber_v3.8_Portable/Junba_AI_Transcriber_v3.8.exe"
          foreach ($args in @(
            @('--windowed-io-self-test', "$pwd/release/WINDOWED_IO_PORTABLE.txt"),
            @('--self-test', "$pwd/release/SELFTEST_PORTABLE.txt"),
            @('--ui-self-test', "$pwd/release/UI_SELFTEST_PORTABLE.txt")
          )) {
            $p = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Portable self-test failed: $($args[0])" }
          }
      - name: Package Portable
        working-directory: src
        shell: pwsh
        run: |
          $zip = "$pwd/release/Junba_AI_Transcriber_v3.8.1_Repack_Portable_Windows_x64.zip"
          Compress-Archive -Path "$pwd/dist/Junba_AI_Transcriber_v3.8_Portable/*" -DestinationPath $zip -Force
          "ZIP  $((Get-FileHash $zip -Algorithm SHA256).Hash)  $([IO.Path]::GetFileName($zip))" | Set-Content "$pwd/release/SHA256SUMS_PORTABLE.txt" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Junba-AI-Transcriber-v3.8.1-Repack-Portable-Windows-x64
          path: |
            src/release/Junba_AI_Transcriber_v3.8.1_Repack_Portable_Windows_x64.zip
            src/release/SHA256SUMS_PORTABLE.txt
            src/release/SELFTEST_PORTABLE.txt
            src/release/UI_SELFTEST_PORTABLE.txt
            src/release/WINDOWED_IO_PORTABLE.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: src/release/Junba_AI_Transcriber_v3.8.1_Repack_Portable_Windows_x64.zip

  single-exe:
    name: Build Single EXE x64
    needs: validate-windows
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { path: repack }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BASE_REPO }}
          ref: ${{ env.BASE_REF }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: src/requirements.txt
      - name: Patch and install
        shell: pwsh
        run: |
          python repack/tools/apply_v381_patch.py --root src
          python repack/tools/verify_v381_patch.py --root src
          cd src
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build Single EXE
        working-directory: src
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean JunbaAITranscriber_onefile.spec
          $exe = "$pwd/dist/Junba_AI_Transcriber_v3.8.exe"
          if (!(Test-Path $exe)) { throw 'Single EXE not found' }
      - name: Single EXE self-tests
        working-directory: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exe = "$pwd/dist/Junba_AI_Transcriber_v3.8.exe"
          foreach ($args in @(
            @('--windowed-io-self-test', "$pwd/release/WINDOWED_IO_SINGLE.txt"),
            @('--self-test', "$pwd/release/SELFTEST_SINGLE.txt"),
            @('--ui-self-test', "$pwd/release/UI_SELFTEST_SINGLE.txt")
          )) {
            $p = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Single self-test failed: $($args[0])" }
          }
      - name: Package Single EXE
        working-directory: src
        shell: pwsh
        run: |
          Copy-Item "$pwd/dist/Junba_AI_Transcriber_v3.8.exe" "$pwd/release/Junba_AI_Transcriber_v3.8.1_Repack_Single_EXE_Windows_x64.exe" -Force
          $exe = "$pwd/release/Junba_AI_Transcriber_v3.8.1_Repack_Single_EXE_Windows_x64.exe"
          "EXE  $((Get-FileHash $exe -Algorithm SHA256).Hash)  $([IO.Path]::GetFileName($exe))" | Set-Content "$pwd/release/SHA256SUMS_SINGLE.txt" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Junba-AI-Transcriber-v3.8.1-Repack-Single-EXE-Windows-x64
          path: |
            src/release/Junba_AI_Transcriber_v3.8.1_Repack_Single_EXE_Windows_x64.exe
            src/release/SHA256SUMS_SINGLE.txt
            src/release/SELFTEST_SINGLE.txt
            src/release/UI_SELFTEST_SINGLE.txt
            src/release/WINDOWED_IO_SINGLE.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: src/release/Junba_AI_Transcriber_v3.8.1_Repack_Single_EXE_Windows_x64.exe

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repack tools
        uses: actions/checkout@v4
        with:
          path: repack
      - name: Checkout pinned Android source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ANDROID_REPO }}
          ref: ${{ env.ANDROID_REF }}
          path: android-src
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate or bootstrap Android sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for p in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf /tmp/android-cli && mkdir -p /tmp/android-cli
            unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "sdkmanager=$SDKMANAGER"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Android source preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f android-src/android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          grep -q 'setFixedLengthStreamingMode' android-src/android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          grep -q 'gemini-3.5-transcribe' android-src/android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          ! grep -R "fixedLengthStreamingMode(" android-src/android/app/src/main/java || false
      - name: Compile Android Java
        shell: bash
        run: gradle -p android-src/android :app:compileDebugJavaWithJavac --no-daemon --stacktrace
      - name: Build Android APK
        shell: bash
        run: gradle -p android-src/android :app:assembleDebug --no-daemon --stacktrace
      - name: Package APK
        shell: bash
        run: |
          mkdir -p release
          cp android-src/android/app/build/outputs/apk/debug/app-debug.apk release/Junba_AI_Transcriber_v3.8.1_Android_Gemini.apk
          sha256sum release/Junba_AI_Transcriber_v3.8.1_Android_Gemini.apk > release/SHA256SUMS_ANDROID.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Junba-AI-Transcriber-v3.8.1-Android-APK
          path: |
            release/Junba_AI_Transcriber_v3.8.1_Android_Gemini.apk
            release/SHA256SUMS_ANDROID.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/Junba_AI_Transcriber_v3.8.1_Android_Gemini.apk
